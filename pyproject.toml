[project]
name = "closed-loop-eval-lab"
version = "0.1.0"
description = "Auditable evaluation toolkit: when do better open-loop scores fail to predict better closed-loop behavior?"
requires-python = ">=3.11,<3.12"  # metadrive-simulator 0.4.3 requires <3.12
dependencies = ["numpy>=1.26", "scipy>=1.13"]

[project.optional-dependencies]
sim = ["metadrive-simulator==0.4.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["simulator: needs the real MetaDrive simulator (uv sync --extra sim)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"src/eval_lab/report.py" = ["E501"]  # long prose strings read better unbroken
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]
